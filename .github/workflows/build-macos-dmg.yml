name: Build macOS DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the DMG filename"
        required: false
        default: "v3"

jobs:
  build-macos-dmg:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v3" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DMG
        shell: bash
        run: |
          chmod +x scripts/build_macos_dmg.sh
          scripts/build_macos_dmg.sh "${{ steps.version.outputs.value }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sic-opto-downloader-macos-dmg
          path: release-dist/*.dmg
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*.dmg
