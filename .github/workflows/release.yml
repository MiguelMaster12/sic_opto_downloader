name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, for example v3.1"
        required: true
        default: "v3-test"
      draft:
        description: "Create release as draft"
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build platform ZIPs
        run: |
          chmod +x scripts/build_release_zips.sh
          scripts/build_release_zips.sh "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release-dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Windows EXE
        shell: pwsh
        run: scripts/build_windows_exe.ps1 "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release-dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build macOS DMG
        run: |
          chmod +x scripts/build_macos_dmg.sh
          scripts/build_macos_dmg.sh "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release-dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 fuse libfuse2
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Linux AppImage
        run: |
          chmod +x scripts/build_linux_appimage.sh
          scripts/build_linux_appimage.sh "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release-dist/*.AppImage
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - zips
      - windows
      - macos
      - linux
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -lh release-assets
      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: SIC OPTO Downloader ${{ steps.version.outputs.value }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          files: release-assets/*
