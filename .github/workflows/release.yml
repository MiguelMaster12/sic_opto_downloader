name: Build Release Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version label. Leave empty to bump latest vX.Y.Z tag"
        required: false
        default: ""
      draft:
        description: "Create release as draft"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          requested="${{ github.event.inputs.version || '' }}"
          if [[ -n "$requested" ]]; then
            version="$requested"
          else
            latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            if [[ -z "$latest" ]]; then
              version="v3.1.0"
            elif [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              version="v${major}.${minor}.$((patch + 1))"
            else
              echo "Tag semver invalida: $latest" >&2
              exit 1
            fi
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.draft || 'false' }}" == "true" ]]; then
            draft="true"
          else
            draft="false"
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"
          echo "Draft: $draft"

  zips:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - name: Build platform ZIPs
        run: |
          chmod +x scripts/build_release_zips.sh
          scripts/build_release_zips.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release-dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows EXE
        shell: pwsh
        run: scripts/build_windows_exe.ps1 "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release-dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS DMG
        run: |
          chmod +x scripts/build_macos_dmg.sh
          scripts/build_macos_dmg.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release-dist/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 fuse libfuse2
      - name: Build Linux AppImage
        run: |
          chmod +x scripts/build_linux_appimage.sh
          scripts/build_linux_appimage.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release-dist/*.AppImage
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - zips
      - windows
      - macos
      - linux
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -lh release-assets
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SIC OPTO Downloader ${{ needs.prepare.outputs.version }}
          draft: ${{ needs.prepare.outputs.draft }}
          files: release-assets/*
